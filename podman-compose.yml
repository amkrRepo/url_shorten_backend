services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: url-shorten-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: url_shortener_backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - k6-net

  influxdb:
    image: docker.io/library/influxdb:1.8
    container_name: url-shorten-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    networks:
      - k6-net

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: url-shorten-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - influxdb
    networks:
      - k6-net

networks:
  k6-net:
    driver: bridge

volumes:
  pgdata:
